<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Dashboard - AI Web Agent SaaS</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body class="bg-gray-50 min-h-screen">
    <div class="p-8 max-w-7xl mx-auto">
        <div class="flex justify-between items-center mb-8">
            <h1 class="text-3xl font-bold text-gray-800">AI Web Agent SaaS Dashboard</h1>
            <button onclick="logout()" class="bg-red-500 hover:bg-red-600 text-white px-6 py-2 rounded-lg font-semibold transition">Logout</button>
        </div>

        <!-- ANALYTICS CHART SECTION -->
        <div class="bg-white p-6 rounded-xl shadow-sm border border-gray-200 mb-8">
            <h2 class="text-xl font-semibold mb-4 text-gray-700">Client Usage Analytics</h2>
            <div style="height: 300px; width: 100%;">
                <canvas id="usageChart"></canvas>
            </div>
        </div>

        <div class="bg-white p-6 rounded-xl shadow-sm border border-gray-200 mb-8">
            <h2 class="text-xl font-semibold mb-4 text-gray-700">Onboard New Client</h2>
            <form id="onboardForm" class="grid grid-cols-1 md:grid-cols-4 gap-4">
                <input type="text" id="name" placeholder="Client Name" required class="border border-gray-300 p-3 rounded-lg outline-none focus:ring-2 focus:ring-blue-500">
                <input type="email" id="email" placeholder="Email" required class="border border-gray-300 p-3 rounded-lg outline-none focus:ring-2 focus:ring-blue-500">
                <input type="url" id="website_url" placeholder="Website URL" required class="border border-gray-300 p-3 rounded-lg outline-none focus:ring-2 focus:ring-blue-500">
                <button type="submit" id="submitBtn" class="bg-blue-600 text-white p-3 rounded-lg hover:bg-blue-700 font-semibold transition">Add Client</button>
            </form>
            <div id="message" class="mt-4 font-medium hidden p-3 rounded-lg"></div>
        </div>

        <div class="bg-white p-6 rounded-xl shadow-sm border border-gray-200">
            <h2 class="text-xl font-semibold mb-4 text-gray-700">Client Directory & Usage</h2>
            <div class="overflow-x-auto">
                <table class="w-full text-left">
                    <thead>
                        <tr class="border-b border-gray-200 text-gray-500 text-sm">
                            <th class="p-3">Name</th>
                            <th class="p-3">Status</th>
                            <th class="p-3">Messages Sent</th>
                            <th class="p-3">Last Active</th>
                            <th class="p-3 w-1/3">Embed Code</th>
                        </tr>
                    </thead>
                    <tbody id="clientsTable" class="text-gray-700 text-sm"></tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        const currentDomain = window.location.origin;
        document.addEventListener('DOMContentLoaded', loadClients);

        async function loadClients() {
            const tbody = document.getElementById('clientsTable');
            tbody.innerHTML = '<tr><td colspan="5" class="p-8 text-center text-gray-500">Loading...</td></tr>';

            try {
                const response = await fetch('/api/clients');
                if (response.status === 401) { window.location.href = '/login'; return; }

                const clients = await response.json();
                tbody.innerHTML = '';
                if (clients.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="5" class="p-8 text-center text-gray-500">No clients yet.</td></tr>';
                    renderChart([]);
                    return;
                }

                clients.forEach(client => {
                    const color = client.bot_status === 'ready' ? 'bg-green-100 text-green-800' : (client.bot_status === 'scraping' ? 'bg-blue-100 text-blue-800' : 'bg-yellow-100 text-yellow-800');
                    const msgCount = client.message_count || 0;
                    const lastActive = client.last_active || 'Never';

                    const embedCode = `<script>
(function() {
    var s = document.createElement('script');
    s.src = '${currentDomain}/widget-loader.js?api_key=${client.api_key}';
    s.async = true;
    document.body.appendChild(s);
})();
<\/script>`;

                    tbody.innerHTML += `<tr class="border-b hover:bg-gray-50">
                        <td class="p-3 font-medium">${client.name}</td>
                        <td class="p-3"><span class="px-2 py-1 rounded text-xs font-bold ${color}">${client.bot_status}</span></td>
                        <td class="p-3 font-bold text-blue-600">${msgCount}</td>
                        <td class="p-3 text-gray-500 text-xs">${lastActive}</td>
                        <td class="p-3">
                            <div class="flex items-center gap-2">
                                <textarea readonly class="w-full bg-gray-100 border border-gray-300 rounded px-2 py-1 text-xs font-mono text-gray-600 focus:outline-none" rows="3">${embedCode}</textarea>
                                <button onclick="copyCode(this)" class="bg-gray-200 hover:bg-gray-300 text-gray-700 px-3 py-1 rounded text-xs font-bold whitespace-nowrap h-fit">Copy</button>
                            </div>
                        </td>
                    </tr>`;
                });

                // Render the analytics chart
                renderChart(clients);

            } catch (error) { console.error(error); }
        }

        function renderChart(clients) {
            const ctx = document.getElementById('usageChart').getContext('2d');
            if (window.myChart) window.myChart.destroy();

            window.myChart = new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: clients.map(c => c.name),
                    datasets: [{
                        label: 'Total Messages Sent',
                        data: clients.map(c => c.message_count || 0),
                        backgroundColor: '#2563eb',
                        borderRadius: 6,
                        barThickness: 40
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: { display: false },
                        tooltip: {
                            backgroundColor: '#1f2937',
                            padding: 12,
                            cornerRadius: 8
                        }
                    },
                    scales: {
                        y: { beginAtZero: true, grid: { color: '#f3f4f6' } },
                        x: { grid: { display: false } }
                    }
                }
            });
        }

        function copyCode(btn) {
            const textarea = btn.previousElementSibling;
            textarea.select();
            document.execCommand('copy');
            btn.textContent = 'Copied!';
            setTimeout(() => btn.textContent = 'Copy', 2000);
        }

        document.getElementById('onboardForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('submitBtn');
            const msg = document.getElementById('message');
            btn.disabled = true; btn.textContent = 'Adding...'; msg.classList.add('hidden');

            try {
                const response = await fetch('/api/onboard', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        name: document.getElementById('name').value,
                        email: document.getElementById('email').value,
                        website_url: document.getElementById('website_url').value
                    })
                });

                if (response.status === 401) { window.location.href = '/login'; return; }

                if (response.ok) {
                    msg.textContent = '✅ Client added! Scraper is running...';
                    msg.className = 'mt-4 font-medium p-3 rounded-lg bg-green-50 text-green-700';
                    msg.classList.remove('hidden');
                    document.getElementById('onboardForm').reset();
                    setTimeout(loadClients, 1000);
                } else {
                    const err = await response.json();
                    msg.textContent = `❌ Error: ${err.detail || 'Failed'}`;
                    msg.className = 'mt-4 font-medium p-3 rounded-lg bg-red-50 text-red-700';
                    msg.classList.remove('hidden');
                }
            } catch (error) { console.error(error); }
            finally { btn.disabled = false; btn.textContent = 'Add Client'; }
        });

        async function logout() {
            await fetch('/api/auth/logout', { method: 'POST' });
            window.location.href = '/login';
        }
    </script>
</body>
</html>
